<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:linear-gradient(160deg,#7f957d,#a99cbc);}
.page{padding:22px;display:inline-block}
.tag{display:inline-block;background:#a33a37;color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em;padding:4px 9px;border-radius:6px;margin-bottom:6px}
.sub{font-size:11px;color:#1f281f;margin:0 0 10px 2px;font-weight:600}
.w{background:#f8f6f3 center/cover no-repeat;border-radius:22px;box-shadow:0 6px 20px rgba(0,0,0,.22);padding:10px 12px 9px;box-sizing:border-box;display:flex;flex-direction:column;position:relative;overflow:hidden}
.s{width:170px;height:170px;background-image:url(../widgets/bg-small.jpg)}.m{width:364px;height:170px;background-image:url(../widgets/bg-medium.jpg)}
.nobg{background-image:none!important}
.h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}.m .h{margin-bottom:7px}
.logo{display:block;border-radius:8px;height:30px;width:53px}.m .logo{height:36px;width:64px}
.pill{background:rgba(248,246,243,.86);border-radius:8px;padding:3px 7px;display:inline-block}
.leg{color:#5a6859;font-size:10px;font-weight:600}
.panel{background:rgba(248,246,243,.86);border-radius:12px;padding:5px 8px}
.r{display:flex;align-items:center;margin:3px 0}.r .l{color:#4f5e4e;font-size:12px;font-weight:500;flex:1}
.r .t{font-weight:700;font-size:17px;color:#3f4d3f}
.r .k{font-weight:500;font-size:12px;color:#5a6859;margin-left:6px;min-width:30px;text-align:right}
.cols{display:flex;gap:8px}.c{flex:1;background:rgba(248,246,243,.86);border-radius:12px;padding:6px 9px}
.c .l{color:#4f5e4e;font-size:11px;font-weight:500}.c .t{font-weight:700;font-size:24px;color:#3f4d3f;line-height:1.15}
.c .k{font-size:11px;font-weight:500;color:#5a6859}
table{border-collapse:collapse;width:320px}td,th{padding:0;height:19px;text-align:right;width:52px}
th{font-size:10px;font-weight:600;color:#5a6859;height:14px}td.l,th.l{width:60px;text-align:left;color:#4f5e4e;font-size:12px;font-weight:500}
td{font-size:13px;font-weight:500;color:#5a6859}td.t{font-size:15px;font-weight:700;color:#3f4d3f}
.f{margin-top:auto;display:flex}.f .pill{font-size:9px;font-weight:500;color:#5a6859;padding:2px 7px}.f.err .pill{color:#a33a37}
.good{color:#2a6e40!important}.bad{color:#a33a37!important}
.wm{position:absolute;right:12px;bottom:10px;font-size:9px;font-weight:800;color:#a33a37;letter-spacing:.08em;background:rgba(248,246,243,.9);padding:2px 5px;border-radius:6px}
.s .wm{right:-14px;bottom:auto;top:50%;transform:translateY(-50%) rotate(90deg);font-size:7px;padding:1px 4px}

</style></head><body><div class="page" id="p"></div><script>
const q=new URLSearchParams(location.search),size=q.get('size'),state=q.get('state')||'ok',per=q.get('p')||'d7';
const P={today:['Today','Today'],d7:['7 days','7d'],d30:['30 days','30d'],qtd:['This quarter','QTD'],ytd:['Year to date','YTD']};
// EXAMPLE numbers only: [label, today, d7, d30, qtd, ytd]
const M=[['Visits','37','214','902','735','6,480'],['Orders','2','11','46','38','312'],['Sales','$58','$342','$1,415','$1,166','$9.6k']];
const K={today:1,d7:2,d30:3,qtd:4,ytd:5};
const cls={};if(state==='thresholds'){cls['0-today']='good';cls['1-'+per]='bad';}
const foot=state==='offline'?'<div class="f err"><span class="pill">Offline · Updated 7:42 PM</span></div>':'<div class="f"><span class="pill">Updated 8:05 PM</span></div>';
const sm=size==='small';
const head=`<div class="h"><img class="logo" src="../widgets/logo.jpg">${per==='all'?'':`<span class="pill leg">${sm?'today · '+P[per][1]:'today · '+P[per][0].toLowerCase()}</span>`}</div>`;
let body;
if(per==='all') body=`<div class="panel"><table><tr><th class="l"></th>${Object.keys(P).map(k=>`<th>${P[k][1]}</th>`).join('')}</tr>${M.map(m=>`<tr><td class="l">${m[0]}</td>${Object.keys(P).map(k=>`<td class="${k==='today'?'t':''}">${m[K[k]]}</td>`).join('')}</tr>`).join('')}</table></div>`;
else if(sm) body='<div class="panel">'+M.map((m,i)=>`<div class="r"><span class="l">${m[0]}</span><span class="t ${cls[i+'-today']||''}">${m[1]}</span><span class="k ${cls[i+'-'+per]||''}">${m[K[per]]}</span></div>`).join('')+'</div>';
else body=`<div class="cols">${M.map((m,i)=>`<div class="c"><div class="l">${m[0]}</div><div class="t ${cls[i+'-today']||''}">${m[1]}</div><div class="k">${P[per][1]}&nbsp; <span class="${cls[i+'-'+per]||''}">${m[K[per]]}</span></div></div>`).join('')}</div>`;
const label='EXAMPLE NUMBERS — mock preview';
if(state==='nobg'){/* logo still shown if cached; here show text fallback */}
const sub={ok:`Widget Parameter: ${per==='d7'?'(empty) = 7d':per==='all'?'all':P[per][1].toLowerCase()==='30d'?'30d':P[per][1].toLowerCase()}`,thresholds:`Parameter ${(P[per]||['','all'])[1].toLowerCase()} · thresholds set (off by default)`,offline:'Offline — showing last saved numbers',nobg:'Images not downloaded yet / offline — plain cream fallback'}[state];
const head2=state==='nobg'?head.replace(/<img[^>]*>/,`<span class="pill" style="font-weight:700;font-size:${sm?15:13}px;color:#3f4d3f">${sm?'IENN':'Inland Empire Native Nursery'}</span>`):head;
document.getElementById('p').innerHTML=`<div class="tag">${label}</div><div class="sub">${sub}</div><div class="w ${sm?'s':'m'} ${state==='nobg'?'nobg':''}">${head2}${body}${foot}<span class="wm">EXAMPLE</span></div>`;
</script></body></html>
